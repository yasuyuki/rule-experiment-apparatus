name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apparatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r apparatus/requirements.txt
      - run: |
          git config --global user.name Fixture
          git config --global user.email fixture@example.invalid
      - run: python apparatus/docs_check.py
      - run: python apparatus/cycle.py --environment apparatus/schemas/environment.example.json --selfcheck
      - run: python apparatus/tests/test_claude_code_adapter.py
      - run: python apparatus/tests/test_cycle.py
      - run: python apparatus/tests/test_codex_adapter.py

  codex-telemetry-query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yasuyuki/agent-telemetry
          ref: bdf0e5d09b765f1c1e8a852180830a742b747a37
          path: collector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r apparatus/requirements.txt ./collector
      - run: |
          git config --global user.name Fixture
          git config --global user.email fixture@example.invalid
      - run: python -m unittest discover -s tests -v
        working-directory: collector
      - name: Require installed telemetry query integration and source identity
        run: |
          export AGENT_TELEMETRY_PYTHON="$(command -v python)"
          export AGENT_TELEMETRY_SOURCE="$GITHUB_WORKSPACE/collector"
          python apparatus/tests/test_codex_adapter.py --require-collector

  wsl-executor:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r apparatus/requirements.txt
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          wsl-shell-user: root
          additional-packages: git curl
      - shell: wsl-bash {0}
        run: |
          git config --global user.name Fixture
          git config --global user.email fixture@example.invalid
      - name: Install the declared executor Python in WSL
        shell: wsl-bash {0}
        run: |
          curl -fsSL -o /tmp/executor-python.tar.gz https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.14.8%2B20261003-x86_64-unknown-linux-gnu-install_only.tar.gz
          echo "371b6c281bbb09b29279e9e3a2996bab4ae2ea03cca52bf869f8bd89286b0ae8  /tmp/executor-python.tar.gz" | sha256sum -c -
          mkdir -p /opt/executor-python
          tar -xzf /tmp/executor-python.tar.gz -C /opt/executor-python --strip-components=1
          /opt/executor-python/bin/python3 -V
      - run: python apparatus/tests/test_wsl_materialize.py
        env:
          APPARATUS_WSL_PYTHON: /opt/executor-python/bin/python3
