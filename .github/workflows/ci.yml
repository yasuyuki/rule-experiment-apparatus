name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: .\wrapper\Invoke-FoundationTests.ps1 -Suite portable
      - shell: pwsh
        run: .\tools\opencode-policy\Test-OpenCodePolicy.ps1

  apparatus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r apparatus/requirements.txt
      - run: python apparatus/docs_check.py
      - run: python apparatus/cycle.py --environment apparatus/schemas/environment.example.json --selfcheck
